version: '3.8'

services:
  price-optimizer:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - MODEL_PATH=/app/models/catboost_taxi_smart.joblib
      - DATA_PATH=/app/data/train.csv
      - LOG_DIR=/var/log/price-optimizer
      - PROCESS_POOL_WORKERS=0
      - THREAD_POOL_WORKERS=16
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - logs:/var/log/price-optimizer
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  logs: